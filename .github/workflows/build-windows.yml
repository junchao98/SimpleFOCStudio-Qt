name: Build

on:
  push:
    branches: [ci/windows-build, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtserialport qtcharts'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt libraries
        run: |
          cd build/Release
          windeployqt SimpleFOCStudio.exe --release --no-translations --no-opengl-sw

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleFOCStudio-Windows
          path: build/Release/

  build-linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev libqt6serialport6-dev libqt6charts6-dev \
            libgl1-mesa-dev dpkg-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build deb package
        env:
          VERSION: ${{ vars.RELEASE_VERSION || '0.0.0-dev' }}
        run: |
          OS_TAG="${{ matrix.os }}"
          DEB_FILENAME="simplefocstudio_${VERSION}_amd64_${OS_TAG}.deb"

          STAGE_DIR="/tmp/simplefocstudio-deb"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}/DEBIAN"
          mkdir -p "${STAGE_DIR}/usr/bin"
          mkdir -p "${STAGE_DIR}/usr/share/applications"
          mkdir -p "${STAGE_DIR}/usr/share/icons/hicolor/256x256/apps"

          sed "s/^Version: .*/Version: ${VERSION}/" tools/deb/DEBIAN/control > "${STAGE_DIR}/DEBIAN/control"
          cp build/SimpleFOCStudio "${STAGE_DIR}/usr/bin/SimpleFOCStudio"
          strip "${STAGE_DIR}/usr/bin/SimpleFOCStudio"

          # Auto-detect shared library dependencies from binary
          DEPS_WORK_DIR=$(mktemp -d)
          mkdir -p "${DEPS_WORK_DIR}/debian"
          printf "Source: simplefocstudio\nPackage: simplefocstudio\nArchitecture: any\n" > "${DEPS_WORK_DIR}/debian/control"
          DEPS=$(cd "${DEPS_WORK_DIR}" && dpkg-shlibdeps -O "${STAGE_DIR}/usr/bin/SimpleFOCStudio" 2>/dev/null \
                 | grep '^shlibs:Depends=' | cut -d= -f2-)
          rm -rf "${DEPS_WORK_DIR}"
          if [ -z "${DEPS}" ]; then
            DEPS="libqt6core6, libqt6gui6, libqt6widgets6, libqt6serialport6, libqt6charts6, libc6, libgcc-s1, libstdc++6"
          fi
          echo "Detected dependencies: ${DEPS}"
          sed -i "s/\${shlibs:Depends}/${DEPS}/" "${STAGE_DIR}/DEBIAN/control"

          cp tools/deb/simplefocstudio.desktop "${STAGE_DIR}/usr/share/applications/"
          cp resources/icons/motor.png "${STAGE_DIR}/usr/share/icons/hicolor/256x256/apps/simplefocstudio.png"

          dpkg-deb --build "${STAGE_DIR}" "${DEB_FILENAME}"
          rm -rf "${STAGE_DIR}"

          mkdir -p dist
          mv "${DEB_FILENAME}" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleFOCStudio-${{ matrix.os }}
          path: dist/*.deb
